name: Publish RPM repository

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to publish (for example, v0.29.0-beta). Leave empty for the latest releases.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rpm-repository
  cancel-in-progress: false

jobs:
  build:
    name: Build signed repository
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install tools
        run: dnf --assumeyes install createrepo_c gh git gnupg2 rpm-build rpm-sign tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve releases
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          set -euo pipefail
          stable_tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          nightly_tag="$(gh release list --repo OpenTubeX/OpenTubeX --limit 100 \
            --json isPrerelease,publishedAt,tagName \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly-[0-9]+$")))] | sort_by(.publishedAt) | last | .tagName // ""')"

          # Release listings can lag behind, so the dispatched tag takes precedence.
          if [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            stable_tag="$REQUESTED_TAG"
          elif [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+$ ]]; then
            nightly_tag="$REQUESTED_TAG"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            echo "Expected a stable or nightly OpenTubeX tag, got: $REQUESTED_TAG" >&2
            exit 1
          fi

          if [[ ! "$stable_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            echo "Expected a stable tag, got: $stable_tag" >&2
            exit 1
          fi

          # The nightly repository follows whichever of the two was published last.
          published_at() {
            gh release view "$1" --repo OpenTubeX/OpenTubeX --json publishedAt --jq .publishedAt
          }
          if [[ -z "$nightly_tag" || "$(published_at "$stable_tag")" > "$(published_at "$nightly_tag")" ]]; then
            nightly_tag="$stable_tag"
          fi

          {
            echo "stable_tag=$stable_tag"
            echo "nightly_tag=$nightly_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing key
        id: signing-key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RPM_GPG_PRIVATE_KEY" ]]; then
            echo 'The RPM_GPG_PRIVATE_KEY secret is not configured.' >&2
            exit 1
          fi
          if [[ -z "$RPM_GPG_PASSPHRASE" ]]; then
            echo 'The RPM_GPG_PASSPHRASE secret is not configured.' >&2
            exit 1
          fi

          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"

          if [[ -z "$fingerprint" ]]; then
            echo 'No private signing key was imported.' >&2
            exit 1
          fi

          passphrase_file="$RUNNER_TEMP/rpm-gpg-passphrase"
          printf '%s' "$RPM_GPG_PASSPHRASE" > "$passphrase_file"
          chmod 0600 "$passphrase_file"

          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "passphrase-file=$passphrase_file" >> "$GITHUB_OUTPUT"

      - name: Build signed repository
        env:
          RPM_GPG_KEY_ID: ${{ steps.signing-key.outputs.fingerprint }}
          RPM_GPG_PASSPHRASE_FILE: ${{ steps.signing-key.outputs.passphrase-file }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
        run: ./scripts/build-repository.sh "$STABLE_TAG" "$NIGHTLY_TAG" repository

      - name: Upload repository
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository

  copr:
    name: Trigger COPR build
    if: github.event.action != 'opentubex-nightly' && !contains(inputs.releaseTag, '-nightly-')
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Trigger build
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            echo "Expected a tag like v0.29.0-beta, got: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -z "$COPR_WEBHOOK_URL" ]]; then
            echo 'The COPR_WEBHOOK_URL secret is not configured.' >&2
            exit 1
          fi

          wget --quiet --output-document=- \
            --timeout=30 --tries=3 \
            --post-data="$RELEASE_TAG" \
            "$COPR_WEBHOOK_URL"

  deploy:
    name: Publish repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
